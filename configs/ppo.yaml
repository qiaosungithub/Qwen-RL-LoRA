# PPO Configuration
# Inherits from base.yaml

base: base.yaml
method: ppo

training:
  output_dir: outputs/qwen-ppo-gsm8k
  per_device_train_batch_size: 4

  # PPO-specific settings
  ppo_epochs: 4                 # Number of PPO update epochs per batch
  kl_coef: 0.05                 # KL divergence coefficient
  cliprange: 0.2                # PPO clipping range
  vf_coef: 0.1                  # Value function loss coefficient
